services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cpu_performance_analyzer
      POSTGRES_PASSWORD: cpu_performance_analyzer
      POSTGRES_DB: cpu_performance_analyzer
    ports: ["5432:5432"]
    volumes: ["cpu_performance_analyzer_pg:/var/lib/postgresql/data"]
volumes:
  cpu_performance_analyzer_pg:
